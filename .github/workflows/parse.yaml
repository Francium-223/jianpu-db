name: Parse Scores Metadata

on:
  push:
    branches:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parse-scores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    # jptok.py(简谱 token 的唯一实现)住在**兄弟仓库** jianpu2/skills/jianpu-melody-lookup,
    # 而 runner 只 checkout 本仓库 -> 找不到就是硬依赖报错(2026-09-24 实测: publish 那条 workflow
    # 就是这么挂的)。这里**显式**允许用 score.py 里的兜底口径: 它与 jptok 已被
    # `check_jptok_parity.py` 拿全语料 723 万个 token 证明逐项一致, 而且下面新增的一步
    # **每次 CI 都会重新证明**(或直接红掉): 2026-09-28 就是这两份漂了、CI 静默改写了 3044 首。
    # 想让 CI 用**唯一实现**: 给这个仓库加一个 PAT secret `JIANPU_PAT`(下面那步会去拉兄弟仓库)。
    env:
      JIANPU_ALLOW_FALLBACK_JTOK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Checkout sibling jianpu2 (可选, 有 PAT 才拉得到)
        # ⚠ 位置其实不对: score.py 找的是 `<repo>/../jianpu2/skills/jianpu-melody-lookup`(仓库的**兄弟目录**),
        #   而 `path: jianpu2` 落在 `<repo>/jianpu2` —— 所以 CI 实际上一直走的是下面那个兜底口径。
        #   要真用上唯一实现, 得把这里换成落到 `<repo>/../jianpu2`(或加一条软链)。但无论怎么改:
        #   **这个目录绝不能被 `git add -A` 提交**(见下面 Commit 步骤里的 gitlink 兜底), 那是 2026-09-24
        #   checkout --recursive 直接报 `No url found for submodule path 'jianpu2'` 的原因。
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Francium-223/jianpu2
          path: jianpu2
          token: ${{ secrets.JIANPU_PAT || github.token }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run python parse_scores.py
        id: meta
        shell: bash
        run: |
          python parse_scores.py
      # 重建完**先断言, 再提交**。为什么需要(2026-09-28 的真实事故, 见 tools/check_data_sane.py 顶部):
      # 本地修好了 jptok.recover_bars 的"重复小节线", 而 CI 走的是**还没同步**的内置兜底 ->
      # CI 把 3044 首的重复线又改了回来并以 bot 身份提交, 远端与前端索引从此不一致。
      # 口径漂了就让 workflow 红, 不要静默改写 3000 首。
      - name: 产物断言（拒绝提交坏数据）
        shell: bash
        run: python tools/check_data_sane.py
      # 上面那条只是最低防线。有兄弟仓库时直接证明"两份口径逐项一致" —— 这才是根治。
      # 兄弟仓库 checkout 到 `<repo>/jianpu2`(actions/checkout 的 path 不能越出 workspace),
      # 所以这里显式告诉 parity 脚本本仓库在哪。
      - name: 两份口径等价性（有 jianpu2 才跑）
        if: ${{ hashFiles('jianpu2/tools/check_jptok_parity.py') != '' }}
        shell: bash
        env:
          JIANPU_DB: ${{ github.workspace }}
        run: python jianpu2/tools/check_jptok_parity.py --scores scores
      - name: Commit and push changes
        shell: bash                      # 本 job 默认 pwsh, 下面那道 gitlink 兜底是 bash 语法
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # 2026-09-24 事故: 上面那步 "Checkout sibling jianpu2" 把兄弟仓库 checkout 到本仓库里的
          # jianpu2/, 紧接着 `git add -A` 就把它当成 **submodule(gitlink)** 提交了
          # (bot 提交 2f60fb58)。之后每次 checkout 带 `submodules: recursive` 都硬报
          # `fatal: No url found for submodule path 'jianpu2' in .gitmodules` —— 整个 workflow 起不来。
          # .gitignore 里已把 jianpu2/ 挡住; 这里再**响亮地**兜一道: 索引里出现 gitlink 就直接失败,
          # 不要让它悄悄进历史(那种错在 CI 的 checkout 阶段报, 跟本次改动八竿子打不着, 极难查)。
          if git ls-files -s | awk '$1 == "160000" { print "  索引里的 gitlink: " $4; n++ } END { exit !n }'; then
            echo "::error::索引里出现了 submodule(gitlink) —— 兄弟仓库 jianpu2 不该被提交进来(见 .gitignore)"
            exit 1
          fi
          git diff --staged --quiet || git commit -m "chore: auto-regenerate folder [skip ci]"
          git push