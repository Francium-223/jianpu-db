name: Parse Scores

on:
  push:
    branches:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parse-scores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          python parse_tags.py
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-regenerate jsons and links [skip ci]"
          file_pattern: 'path/to/your_folder/*'
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-regenerate folder [skip ci]"
          git push